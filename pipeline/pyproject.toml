[project]
name = "smashr-pipeline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "onnxruntime",
    "rtmlib",
    "torch",
    "torchvision",
    "pandas",
    "scipy",
    "tqdm",
    "gdown",
    "pycocotools>=2.0.11",
    "matplotlib>=3.11.2",
    "parse>=1.22.4",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.uv]
package = false
