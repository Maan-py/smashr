<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label Pukulan</title>
<style>
  :root { color-scheme: dark; --bg: #15181c; --panel: #20252b; --text: #eceff2; --muted: #9aa5b1; --accent: #4cc38a; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; max-width: 1400px; margin: auto; }
  video { width: 100%; max-height: 72vh; background: #000; display: block; }
  section, aside { min-width: 0; }
  aside { background: var(--panel); padding: 12px; border-radius: 8px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h2 { font-size: 15px; margin: 12px 0 4px; }
  kbd { background: #343b44; padding: 0 5px; border-radius: 4px; font-size: 13px; }
  button { background: #343b44; color: var(--text); border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 8px 0; }
  .muted { color: var(--muted); }
  #player { color: var(--accent); font-weight: 600; }
  #list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 42vh; overflow-y: auto; }
  #list li { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid #343b44; cursor: pointer; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<main>
  <section>
    <h1>Label Pukulan</h1>
    <div class="bar">
      <input id="file" type="file" accept="video/*" aria-label="Pilih video">
      <label>fps <input id="fps" type="number" step="0.01" value="29.92" style="width:80px"></label>
    </div>
    <video id="video" muted></video>
    <div class="bar">
      <span id="time">0.000 dtk · frame 0</span>
      <span>Kecepatan <span id="rate">1</span>×</span>
      <span>Pemain: <span id="player">dekat</span></span>
    </div>
  </section>
  <aside>
    <h2>Saat kok kena raket</h2>
    <p><kbd>S</kbd> smash · <kbd>L</kbd> lob · <kbd>D</kbd> dropshot · <kbd>O</kbd> lainnya, termasuk servis</p>
    <h2>Kontrol</h2>
    <p><kbd>Spasi</kbd> putar/jeda · <kbd>←</kbd><kbd>→</kbd> 1 frame · <kbd>↑</kbd><kbd>↓</kbd> kecepatan<br>
       <kbd>Tab</kbd> ganti pemain · <kbd>Z</kbd> batalkan terakhir</p>
    <div class="bar">
      <strong><span id="count">0</span> label</strong>
      <button id="export">Unduh CSV</button>
      <button id="clear">Hapus semua</button>
    </div>
    <p id="totals" class="muted"></p>
    <ul id="list"></ul>
  </aside>
</main>
<script>
const STORE = "smashr-labels";
const SHOTS = { s: "smash", l: "lob", d: "dropshot", o: "lainnya" };
const RATES = [0.1, 0.25, 0.5, 1, 1.5];
const $ = (id) => document.getElementById(id);
const video = $("video");

let labels = load();
let player = "dekat";
let rateIndex = 3;

function load() {
  try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; }
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(labels)); } catch { /* tetap jalan tanpa penyimpanan */ }
}
function fps() { return Number($("fps").value) || 30; }
function frameAt(t) { return Math.round(t * fps()); }

function render() {
  labels.sort((a, b) => a.time - b.time);
  $("count").textContent = labels.length;
  const totals = {};
  labels.forEach((l) => { totals[l.shot] = (totals[l.shot] || 0) + 1; });
  $("totals").textContent = Object.entries(totals).map(([k, v]) => `${k}: ${v}`).join(" · ");
  const list = $("list");
  list.replaceChildren(...labels.slice().reverse().map((l) => {
    const li = document.createElement("li");
    const text = document.createElement("span");
    text.textContent = `${l.time.toFixed(2)} dtk · ${l.shot} · ${l.player}`;
    const del = document.createElement("button");
    del.textContent = "×";
    del.setAttribute("aria-label", "Hapus label");
    del.onclick = (e) => {
      e.stopPropagation();
      labels.splice(labels.indexOf(l), 1);
      save();
      render();
    };
    li.onclick = () => { video.currentTime = l.time; };
    li.append(text, del);
    return li;
  }));
}

function showTime() {
  const t = video.currentTime;
  $("time").textContent = `${t.toFixed(3)} dtk · frame ${frameAt(t)}`;
}

function step(frames) {
  video.pause();
  video.currentTime = Math.max(0, video.currentTime + frames / fps());
}

function setRate(delta) {
  rateIndex = Math.min(RATES.length - 1, Math.max(0, rateIndex + delta));
  video.playbackRate = RATES[rateIndex];
  $("rate").textContent = RATES[rateIndex];
}

function exportCsv() {
  const rows = labels.map((l) => [l.time.toFixed(3), frameAt(l.time), l.shot, l.player].join(","));
  const csv = ["time_s,frame,shot,player", ...rows].join("\n") + "\n";
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "labels.csv";
  a.click();
  URL.revokeObjectURL(a.href);
}

$("file").onchange = (e) => {
  const file = e.target.files[0];
  if (file) video.src = URL.createObjectURL(file);
  e.target.blur();
};
$("export").onclick = exportCsv;
$("clear").onclick = () => {
  if (confirm("Hapus semua label?")) { labels = []; save(); render(); }
};
video.ontimeupdate = showTime;
video.onseeked = showTime;

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  const key = e.key.toLowerCase();
  if (SHOTS[key]) {
    labels.push({ time: video.currentTime, shot: SHOTS[key], player, added: Date.now() });
    save();
    render();
  } else if (key === " ") {
    e.preventDefault();
    video.paused ? video.play() : video.pause();
  } else if (key === "arrowleft") { e.preventDefault(); step(-1); }
  else if (key === "arrowright") { e.preventDefault(); step(1); }
  else if (key === "arrowup") { e.preventDefault(); setRate(1); }
  else if (key === "arrowdown") { e.preventDefault(); setRate(-1); }
  else if (key === "tab") {
    e.preventDefault();
    player = player === "dekat" ? "jauh" : "dekat";
    $("player").textContent = player;
  } else if (key === "z") {
    const last = labels.reduce((a, b) => (a && a.added > b.added ? a : b), null);
    if (last) { labels.splice(labels.indexOf(last), 1); save(); render(); }
  }
});

render();
</script>
</body>
</html>
